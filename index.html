<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zuro status</title>
<meta name="description" content="Live availability for Zuro services." />
<link rel="icon" href="https://getzuro.com/assets/favicon.svg" />
<style>
  :root{
    --bg:#0B101C; --panel:#11172a; --panel-2:#161d36;
    --line:rgba(255,255,255,.09); --text:#EDEFF5; --muted:#9AA3B2;
    --accent:#5548FE; --up:#3ecf8e; --down:#e5484d; --nodata:rgba(255,255,255,.10);
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  /* nav */
  nav{display:flex;align-items:center;gap:16px;padding:18px 0}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand img{height:26px;width:auto;max-width:150px;object-fit:contain}
  .navlinks{display:flex;align-items:center;gap:6px}
  .navlinks a{padding:6px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted)}
  .navlinks a:hover{color:var(--text)}
  .navlinks a.active{background:var(--panel-2);color:var(--text)}
  .cta{padding:8px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text)}
  .cta:hover{border-color:var(--accent)}
  /* hero */
  .hero{text-align:center;padding:56px 0 34px}
  .badge{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--up);margin-bottom:16px}
  .badge.bad{background:var(--down)}
  .badge svg{width:19px;height:19px}
  h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
  .updated{color:var(--muted);font-size:13.5px;margin:0}
  /* card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .group{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
  .group .host{font-size:14px;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(62,207,142,.13);color:var(--up)}
  .pill.bad{background:rgba(229,72,77,.13);color:var(--down)}
  .pill .dot{width:13px;height:13px;border-radius:50%;background:currentColor;display:inline-flex;align-items:center;justify-content:center}
  .pill .dot svg{width:8px;height:8px;color:var(--panel)}
  .svc{padding:6px 18px 20px;border-top:1px solid var(--line)}
  .svc:first-of-type{border-top:1px solid var(--line)}
  .svcrow{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
  .svcname{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:600}
  .svcname .tick{width:15px;height:15px;border-radius:50%;background:var(--up);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .svcname .tick.bad{background:var(--down)}
  .svcname .tick svg{width:9px;height:9px;color:var(--panel)}
  .uptime{font-size:13px;font-weight:600;color:var(--up)}
  .uptime.bad{color:var(--down)}
  .bars{display:flex;gap:2px;height:30px;align-items:stretch}
  .bars i{flex:1;border-radius:2px;background:var(--nodata);min-width:2px}
  .bars i.up{background:var(--up)}
  .bars i.down{background:var(--down)}
  .bars i.part{background:#e0a340}
  .axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}
  .meta{color:var(--muted);font-size:12.5px}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:34px 0 44px}
  footer a{text-decoration:underline;text-underline-offset:2px}
  .err{padding:20px;text-align:center;color:var(--muted);font-size:14px}
  @media (max-width:560px){ .navlinks a{padding:6px 8px} .brand img{height:22px} }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="brand" href="https://getzuro.com"><img src="https://getzuro.com/assets/logo.svg" alt="Zuro" /></a>
    <div class="navlinks">
      <a class="active" href="./">Status</a>
      <a href="https://zuro-trust-center-7yxye.ondigitalocean.app">Trust Center</a>
      <a href="https://getzuro.com">Website</a>
    </div>
    <a class="cta" href="mailto:hello@askzuro.com">Get in touch</a>
  </nav>

  <div class="hero">
    <div class="badge" id="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 id="headline">Checking status…</h1>
    <p class="updated" id="updated"></p>
  </div>

  <div class="card">
    <div class="group">
      <span class="host">getzuro.com</span>
      <span class="pill" id="grouppill"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span> Operational</span>
    </div>
    <div id="services"><div class="err">Loading…</div></div>
  </div>

  <footer>
    Monitored every 5 minutes · <a href="https://github.com/vaishnavvijay-prog/zuro-status">open source</a>, powered by <a href="https://upptime.js.org">Upptime</a>
  </footer>
</div>

<script>
(function(){
  var SRC = "https://raw.githubusercontent.com/vaishnavvijay-prog/zuro-status/master/history/summary.json";
  var DAYS = 90;

  function el(t,c,txt){var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}
  function tick(bad){
    var s=el("span","tick"+(bad?" bad":""));
    s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">'+(bad?'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>':'<polyline points="20 6 9 17 4 12"/>')+'</svg>';
    return s;
  }
  function dayKey(d){return d.toISOString().slice(0,10);}

  function bars(site){
    var wrap=el("div","bars");
    var down=site.dailyMinutesDown||{};
    var today=new Date();
    for(var i=DAYS-1;i>=0;i--){
      var d=new Date(today); d.setDate(today.getDate()-i);
      var k=dayKey(d), b=el("i");
      if(k in down){ b.className = down[k]>=60 ? "down" : "part"; b.title=k+" — "+down[k]+" min down"; }
      else if(site.__seen && k>=site.__seen){ b.className="up"; b.title=k+" — operational"; }
      else { b.title=k+" — no data"; }
      wrap.appendChild(b);
    }
    return wrap;
  }

  fetch(SRC,{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json();
  }).then(function(sites){
    var anyDown = sites.some(function(s){return s.status!=="up";});
    var badge=document.getElementById("badge");
    document.getElementById("headline").textContent = anyDown ? "Some services are down" : "All services are online";
    if(anyDown){ badge.classList.add("bad"); badge.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#0b1220" stroke-width="3.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'; }
    var gp=document.getElementById("grouppill");
    if(anyDown){ gp.classList.add("bad"); gp.lastChild.textContent=" Degraded"; }

    var now=new Date();
    document.getElementById("updated").textContent = "Last updated on "+now.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" at "+now.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});

    var host=document.getElementById("services"); host.innerHTML="";
    sites.forEach(function(s){
      s.__seen = dayKey(new Date());
      var box=el("div","svc");
      var row=el("div","svcrow");
      var left=el("div","svcname");
      left.appendChild(tick(s.status!=="up"));
      left.appendChild(el("span",null,s.name));
      var up=el("span","uptime"+(s.status!=="up"?" bad":""), s.uptime+" uptime");
      row.appendChild(left); row.appendChild(up);
      box.appendChild(row);
      box.appendChild(bars(s));
      var ax=el("div","axis");
      ax.appendChild(el("span",null,DAYS+" days ago"));
      ax.appendChild(el("span",null,(s.time?s.time+" ms":"")));
      ax.appendChild(el("span",null,"Today"));
      box.appendChild(ax);
      host.appendChild(box);
    });
  }).catch(function(e){
    document.getElementById("headline").textContent="Status unavailable";
    document.getElementById("services").innerHTML='<div class="err">Could not load status data. <a href="https://github.com/vaishnavvijay-prog/zuro-status">View the monitor</a>.</div>';
  });
})();
</script>
</body>
</html>
